<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section id="pokedex">

        <h1>Mi Pokédex</h1>

        <div class="buscador" role="search">
            <label class="buscador__label" for="search">Buscar Pokémon</label>
            <input
                class="buscador__input"
                id="search"
                type="search"
                placeholder="Escribe un nombre…"
                autocomplete="off">
        </div>

        <div id="pokemon">

        </div>

        <dialog id="pokemon__data" data-id="">

        </dialog>

        <div class="loader">
            <button class="loader__button" id="loader__button" type="button">Cargar más Pokemons</button>
        </div>

    </section>

    <script src="js/script.js"></script>
</body>
</html>
