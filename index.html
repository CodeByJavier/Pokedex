<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section id="pokedex">

        <h1>Mi Pokédex</h1>

        <div class="buscador" role="search">
            <label class="buscador__label" for="search">Buscar Pokémon</label>
            <input
                class="buscador__input"
                id="search"
                type="search"
                placeholder="Escribe un nombre…"
                autocomplete="off">
        </div>

        <div class="filter" role="group" aria-labelledby="filter__title">
            <p class="filter__title" id="filter__title">Filtrar por tipo</p>

            <div id="filter__by__types" class="filter__by__type">
                <button type="button" data-type="normal" aria-pressed="false">normal</button>
                <button type="button" data-type="fire" aria-pressed="false">fire</button>
                <button type="button" data-type="water" aria-pressed="false">water</button>
                <button type="button" data-type="electric" aria-pressed="false">electric</button>
                <button type="button" data-type="grass" aria-pressed="false">grass</button>
                <button type="button" data-type="ice" aria-pressed="false">ice</button>
                <button type="button" data-type="fighting" aria-pressed="false">fighting</button>
                <button type="button" data-type="poison" aria-pressed="false">poison</button>
                <button type="button" data-type="ground" aria-pressed="false">ground</button>
                <button type="button" data-type="flying" aria-pressed="false">flying</button>
                <button type="button" data-type="psychic" aria-pressed="false">psychic</button>
                <button type="button" data-type="bug" aria-pressed="false">bug</button>
                <button type="button" data-type="rock" aria-pressed="false">rock</button>
                <button type="button" data-type="ghost" aria-pressed="false">ghost</button>
                <button type="button" data-type="dragon" aria-pressed="false">dragon</button>
                <button type="button" data-type="dark" aria-pressed="false">dark</button>
                <button type="button" data-type="steel" aria-pressed="false">steel</button>
                <button type="button" data-type="fairy" aria-pressed="false">fairy</button>
            </div>
        </div>

        <div id="pokemon">

        </div>

        <dialog id="pokemon__data" data-id="">

        </dialog>

        <div class="loader">
            <button class="loader__button" id="loader__button" type="button">Cargar más Pokemons</button>
        </div>

    </section>

    <script src="js/script.js"></script>
</body>
</html>
